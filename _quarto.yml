project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.rmd"
    - "*.rmd"
    - "!buggy_posts/**"

website:
  title: "datenwerk"
  site-url: https://sebastiansauer.github.io/datenwerk/
  page-footer:
    border: true
    left: |
      Powered by [Quarto](https://quarto.org)
    center: |
      [Impressum](imprint.qmd)
    right: |
      [Datenschutzhinweise](data-privacy.qmd)
  cookie-consent: false
  repo-branch: main
  repo-actions: [issue]
  repo-url: https://github.com/sebastiansauer/datenwerk
  navbar:
    right:
      - about.qmd
      - Hinweise.qmd
      - English.qmd
      - icon: rss
        href: index.xml
      - icon: github
        href: https://github.com/sebastiansauer/


format:
  html:
    theme: yeti
    css: styles.css
    code-tools: true 
    df-print: kable
    opts_chunk: 
      collapse: true
      out.width: "75%"
      fig.align: center
    freeze: auto
    
    
editor: source 

execute:
  freeze: auto
  warning: false
  cache: true
  



  # - bib/bib.bib
bibliography: "ses.bib"
csl: "apa7.csl"
  
  

name: Quarto Publish

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libglpk-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libv8-dev \
            libsodium-dev \
            libmagick++-dev \
            libpoppler-cpp-dev \
            libgsl-dev \
            jags \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages("remotes")
          remotes::install_github("sebastiansauer/teachertools")
          install.packages("renv")
          renv::restore()
        shell: Rscript {0}

      - name: Render
        run: quarto render --threads 2

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages

      - name: Cache Quarto
        uses: actions/cache@v4
        with:
          path: .quarto
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/*.qmd') }}



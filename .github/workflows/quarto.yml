name: Quarto Publish

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies for R packages
        run: |
          install.packages("jsonlite")
          install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))
          lock <- jsonlite::fromJSON("renv.lock", simplifyVector = FALSE)
          pkgs <- names(lock$Packages)
          sr <- pak::pkg_sysreqs(pkgs, sysreqs_platform = "ubuntu-24.04")
          writeLines(sr$packages, "/tmp/sysreqs-packages.txt")
        shell: Rscript {0}

      - name: Apt-install system dependencies
        run: |
          sudo apt-get update
          xargs -a /tmp/sysreqs-packages.txt sudo apt-get install -y --no-install-recommends

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages("remotes")
          remotes::install_github("sebastiansauer/teachertools")
          install.packages("renv")
          renv::restore()
        shell: Rscript {0}

      - name: Render
        run: quarto render --threads 2

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages

      - name: Cache Quarto
        uses: actions/cache@v4
        with:
          path: .quarto
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/*.qmd') }}


